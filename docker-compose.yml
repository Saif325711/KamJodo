version: '3.8'

services:
  kamjodo-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kamjodo_api
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    env_file:
      - ./backend/.env
